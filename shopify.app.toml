# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Pickup Scheduler"
handle = "pickup-scheduler-settings"
application_url = "https://ibc-pickup-scheduler.vercel.app"
embedded = true
client_id = "97c44561f62e59f3612192b5d5c96d48"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_orders added so the post-purchase picker can save the chosen collection
# slot onto the order's note attributes. Everything else stays read-only.
scopes = "read_products,read_orders,read_merchant_managed_fulfillment_orders,write_orders"

[auth]
redirect_urls = [ "https://ibc-pickup-scheduler.vercel.app/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[app_proxy]
url = "https://ibc-pickup-scheduler.vercel.app/proxy"
prefix = "apps"
subpath = "ibc-pickup"

[build]
automatically_update_urls_on_dev = true
