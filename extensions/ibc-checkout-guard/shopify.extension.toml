api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "ibc-checkout-guard"
type = "function"
uid = "f73d73b6-6798-e592-b296-8aa3bc224edf9ecc168f"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/cart_validations_generate_run.graphql"
  export = "cart-validations-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  # WHERE SHOPIFY SENDS THE MERCHANT to switch this on. There was no ui.paths
  # block here at all, so there was nowhere to send them and no way to create
  # the validation - the same omission that left the delivery gate switched
  # off for its whole life, one step earlier.
  # See app/routes/app.checkout-guard.$functionId.$id.jsx
  [extensions.ui.paths]
  create = "/app/checkout-guard/ibc-checkout-guard/new"
  details = "/app/checkout-guard/ibc-checkout-guard/:id"
