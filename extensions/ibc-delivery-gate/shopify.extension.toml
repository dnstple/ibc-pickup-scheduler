api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "ibc-delivery-gate"
type = "function"
uid = "5100d166-8e0d-4cd4-1f59-b983ddb5cc7a1bb6f08c"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.delivery-options.transform.run"
  input_query = "src/cart_delivery_options_transform_run.graphql"
  export = "cart-delivery-options-transform-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  # WHERE SHOPIFY SENDS THE MERCHANT to switch this on. These were both "/"
  # - the scaffold's placeholder - so picking this function in Settings >
  # Shipping and delivery dropped the merchant on the app's home page, nothing
  # was created, and the function never ran. It was written, tested and off
  # for its whole life.
  # See app/routes/app.delivery-customization.$functionId.$id.jsx
  [extensions.ui.paths]
  create = "/app/delivery-customization/ibc-delivery-gate/new"
  details = "/app/delivery-customization/ibc-delivery-gate/:id"
